<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя 💖</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(-45deg, #ff9a9e, #fecfef, #fbc2eb, #ff6a88);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    position: relative;
  }

  @keyframes gradientMove {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 30px;
    padding: 50px 60px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 20, 100, 0.3);
    border: 2px solid rgba(255, 255, 255, 0.5);
    max-width: 90vw;
    z-index: 10;
    position: relative;
  }

  h1 {
    font-size: 2.2rem;
    color: #c2185b;
    margin-bottom: 35px;
    text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.7);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }

  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 60px;
    position: relative;
  }

  button {
    font-size: 1.4rem;
    padding: 15px 40px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }

  #yesBtn {
    background: linear-gradient(135deg, #ff1744, #ff6b9d);
    color: white;
    box-shadow: 0 8px 25px rgba(255, 23, 68, 0.4);
  }

  #yesBtn:hover {
    transform: scale(1.1);
    box-shadow: 0 12px 35px rgba(255, 23, 68, 0.6);
  }

  #noBtn {
    background: linear-gradient(135deg, #9e9e9e, #616161);
    color: white;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    position: relative;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .hidden { display: none !important; }

  /* Экран с признанием */
  #loveScreen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: linear-gradient(135deg, #ff1744, #ff6b9d, #fbc2eb);
    background-size: 300% 300%;
    animation: gradientMove 5s ease infinite;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s;
  }

  #loveScreen.active {
    opacity: 1;
    pointer-events: all;
  }

  #loveScreen h2 {
    font-size: 3rem;
    color: white;
    text-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
    text-align: center;
    padding: 0 20px;
    animation: pulse 1.2s ease-in-out infinite;
  }

  #loveScreen p {
    margin-top: 25px;
    font-size: 1.5rem;
    color: white;
    text-align: center;
    padding: 0 20px;
  }

  /* Летящие сердечки */
  .heart {
    position: fixed;
    font-size: 2rem;
    pointer-events: none;
    animation: floatUp linear forwards;
    z-index: 50;
  }

  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-10vh) scale(1.3) rotate(360deg); opacity: 0; }
  }

  /* Фоновые плавающие сердечки */
  .bg-heart {
    position: fixed;
    bottom: -50px;
    opacity: 0.4;
    animation: floatBg linear infinite;
    pointer-events: none;
  }

  @keyframes floatBg {
    0%   { transform: translateY(0) rotate(0); opacity: 0.4; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  @media (max-width: 600px) {
    .card { padding: 35px 25px; }
    h1 { font-size: 1.5rem; }
    button { font-size: 1.1rem; padding: 12px 28px; }
    #loveScreen h2 { font-size: 2rem; }
    #loveScreen p { font-size: 1.1rem; }
  }
</style>
</head>
<body>

  <!-- Основная карточка -->
  <div class="card" id="mainCard">
    <h1>Ты меня любишь? 💕</h1>
    <div class="buttons">
      <button id="yesBtn">Да 💖</button>
      <button id="noBtn">Нет 💔</button>
    </div>
  </div>

  <!-- Экран признания -->
  <div id="loveScreen">
    <h2>Я так и знал(а)! 💖</h2>
    <p>Я тебя очень сильно люблю! 💕</p>
    <p>Ты — моё самое любимое чудо на свете ✨</p>
  </div>

<script>
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const mainCard = document.getElementById('mainCard');
  const loveScreen = document.getElementById('loveScreen');

  // Кнопка "Нет" убегает
  let noCount = 0;
  const noTexts = ["Нет 💔", "Точно нет?", "Подумай ещё 🤔", "Уверена?", "Последний шанс 😢", "Не убежать 😏"];

  function moveNoBtn() {
    const pad = 20;
    const maxX = window.innerWidth - noBtn.offsetWidth - pad;
    const maxY = window.innerHeight - noBtn.offsetHeight - pad;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.position = 'fixed';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';

    // Меняем текст кнопки
    noBtn.textContent = noTexts[Math.min(noCount, noTexts.length - 1)];
    noCount++;
  }

  // Убегает при наведении и клике
  noBtn.addEventListener('mouseenter', moveNoBtn);
  noBtn.addEventListener('click', moveNoBtn);
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    moveNoBtn();
  });

  // Клик по "Да" — салют
  yesBtn.addEventListener('click', () => {
    mainCard.classList.add('hidden');
    loveScreen.classList.add('active');
    startHeartRain();
  });

  // Дождь из сердечек
  const heartEmojis = ['❤️', '💖', '💕', '💗', '💓', '💞', '💘', '✨', '🌸', '💝'];

  function spawnHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.fontSize = (20 + Math.random() * 30) + 'px';
    heart.style.animationDuration = (3 + Math.random() * 3) + 's';
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
  }

  function startHeartRain() {
    // Резкий старт — 20 сердечек
    for (let i = 0; i < 20; i++) {
      setTimeout(spawnHeart, i * 80);
    }
    // Дальше — непрерывный поток
    setInterval(spawnHeart, 250);
  }

  // Фоновые сердечки с самого начала
  function spawnBgHeart() {
    const heart = document.createElement('div');
    heart.className = 'bg-heart';
    heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.fontSize = (15 + Math.random() * 25) + 'px';
    heart.style.animationDuration = (8 + Math.random() * 6) + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 15000);
  }

  setInterval(spawnBgHeart, 700);
  for (let i = 0; i < 5; i++) setTimeout(spawnBgHeart, i * 200);
</script>

</body>
</html>
